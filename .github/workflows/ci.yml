name: MYRA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Functions
        run: deno check --no-lock --node-modules-dir=none supabase/functions/myra/index.ts supabase/functions/worker/index.ts supabase/functions/_shared/ai-providers.test.ts
      - name: Test multi-provider routing
        run: deno test --allow-env --no-lock --node-modules-dir=none supabase/functions/_shared/ai-providers.test.ts
      - name: Build
        run: pnpm build
